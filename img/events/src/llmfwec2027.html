let seed=11;const r=()=>(seed=(seed*16807)%2147483647)/2147483647;

for(let x=420;x<1200;x+=4){const p=(x-420)/62,y=360-(x-420)*0.22;
 el('circle',{cx:x,cy:y+38*Math.sin(p),r:1.6,fill:'#e4a51c','fill-opacity':.45});
 el('circle',{cx:x,cy:y+38*Math.sin(p+Math.PI),r:1.6,fill:'#3d6fb6','fill-opacity':.45});
 if(x%24==0)el('line',{x1:x,y1:y+38*Math.sin(p),x2:x,y2:y+38*Math.sin(p+Math.PI),stroke:'#8aa0c2','stroke-opacity':.35,'stroke-width':1})}

for(let i=0;i<70;i++)el('text',{x:640+r()*540,y:40+r()*560,'font-size':10+r()*8,'font-family':'monospace',fill:'#5b7bab','fill-opacity':.10+r()*.18}).textContent=r()<.5?'0':'1';
for(let x=0;x<14;x++)for(let y=0;y<6;y++)el('circle',{cx:62+x*14,cy:520+y*12,r:1.6,fill:'#8aa0c2','fill-opacity':.5});
