<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
.conf .n span{color:#0a7f8c}
.title{top:178px;font-size:112px;letter-spacing:-2px;color:#123e7a}
.sub{top:318px;font-size:27px;line-height:1.35;width:620px}
.chips{position:absolute;left:60px;top:420px;display:flex;flex-wrap:wrap;gap:12px;width:640px}
.chip{border:2px solid #b8c6dc;color:#4a5875;border-radius:10px;padding:9px 16px 8px;font-size:21px;font-weight:700;letter-spacing:.5px;background:rgba(255,255,255,.6)}
.chip.m{border-color:#0a7f8c;background:#0a7f8c;color:#fff}
.tf b{color:#0a7f8c}
</style></head><body>
<svg class="bg" width="1200" height="628" id="s"></svg>
<div class="conf"><div class="n"><span>Porto</span> 2027</div><div class="d">27 – 29 October · Portugal · Hybrid</div></div>
<div class="title">IJCCI</div>
<div class="sub">19th International Joint Conference<br>on Computational Intelligence</div>
<div class="chips"><div class="chip m">ECTA</div><div class="chip m">EXPLAINS</div><div class="chip m">AGENTICS</div><div class="chip">NCTA</div><div class="chip">FCTA</div></div>
<script>
let seed=19;const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
const s=document.getElementById('s'),NS='http://www.w3.org/2000/svg';
const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);s.appendChild(e);return e};
// fuzzy membership functions along the bottom right
const g=(m,w)=>{let d='';for(let x=700;x<=1180;x+=4){const y=565-115*Math.exp(-(((x-m)/w)**2));d+=(x==700?'M':'L')+x+' '+y}return d};
[[790,55,'#e8632b'],[900,70,'#0a7f8c'],[1030,60,'#5b7bab'],[1130,45,'#e4a51c']].forEach(([m,w,c])=>el('path',{d:g(m,w),fill:'none',stroke:c,'stroke-opacity':.45,'stroke-width':2.5}));
el('line',{x1:700,y1:566,x2:1180,y2:566,stroke:'#8aa0c2','stroke-opacity':.6});
// layered neural network (neural / agentic) top right
const L=[[4,760],[6,870],[6,980],[3,1090]],P=L.map(([n,x])=>Array.from({length:n},(_,i)=>[x,90+(i+.5)*(290/n)]));
for(let l=0;l<P.length-1;l++)P[l].forEach(a=>P[l+1].forEach(b=>el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#3d5a87','stroke-opacity':.10+r()*.25,'stroke-width':1.1})));
P.flat().forEach((n,i)=>el('circle',{cx:n[0],cy:n[1],r:9,fill:i%7==3?'#e8632b':'#0a7f8c','fill-opacity':.75}));
// evolving population drifting towards an optimum
for(let i=0;i<46;i++){const t=r(),x=1130-t*360+(r()-.5)*70*t,y=395+(r()-.5)*70*t;el('circle',{cx:x,cy:y,r:2.5+3*(1-t),fill:'#5b7bab','fill-opacity':.25+.5*(1-t)})}
el('circle',{cx:1135,cy:395,r:7,fill:'none',stroke:'#e8632b','stroke-width':2.5});
</script></body></html>
