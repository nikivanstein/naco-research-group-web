<script>
let seed=5;const r=()=>(seed=(seed*16807)%2147483647)/2147483647;

// code-evolution tree behind the logo
const N=[[760,560,0]];for(let i=1;i<40;i++){const p=N[Math.floor(r()*Math.min(i,i<8?i:12+i/2))%i];const n=[p[0]+(r()-.5)*150,p[1]-30-r()*45,p[2]+1];if(n[1]<30)n[1]=30+r()*40;n[0]=Math.max(640,Math.min(1170,n[0]));N.push(n);
 el('path',{d:`M${p[0]} ${p[1]} C ${p[0]} ${(p[1]+n[1])/2}, ${n[0]} ${(p[1]+n[1])/2}, ${n[0]} ${n[1]}`,fill:'none',stroke:'#3d5a87','stroke-opacity':.28,'stroke-width':1.3})}
N.forEach((n,i)=>el('circle',{cx:n[0],cy:n[1],r:3+r()*6,fill:i%5==0?'#e30a2b':(i%3==0?'#e4a51c':'#5b7bab'),'fill-opacity':.55}));

for(let i=0;i<9;i++)el('rect',{x:470+(i%3)*14,y:500+i*11,width:60+r()*120,height:5,rx:2.5,fill:'#8aa0c2','fill-opacity':.35});
